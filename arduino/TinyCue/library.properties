name=TinyCue
version=0.1.1
author=Harshit Dev
maintainer=Harshit Dev
sentence=Offline command understanding for microcontrollers: text in, a command and its slot values out.
paragraph=Train a tiny model on your laptop from a file of example sentences, export it as a C array, and this library reads sentences on the board with no network, no LLM and no allocation. About 5 ms a sentence on a 150 MHz Cortex-M33. Every answer carries a calibrated confidence and an unsure flag, so the device can ask again instead of guessing. English and Hinglish. Needs a 32 bit MCU with roughly 300 KB of free flash and 12 KB of RAM.
