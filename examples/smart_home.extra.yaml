# Extra training sentences for examples/smart_home.yaml, written answer first.
#
# The answer is written first and the sentences are written for it, so every line is
# labelled by construction. Markup, [the words](slot_name), teaches a new way of saying
# a value: it goes into the gazetteer, into decoding and into the exported blob, so the
# generator can then use it in every other sentence.
#
#   edgenlu train examples/smart_home.yaml --extra examples/smart_home.extra.yaml \
#       --dev examples/smart_home.dev.yaml -o out/model
#
# Nothing here was copied from a test set. The point is variety: different verbs, word
# orders, polite and blunt, short and long, typos, run-ons from speech to text, English
# and Hinglish, and plenty of near misses that use these words and mean nothing.

