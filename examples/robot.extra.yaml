# Extra training sentences for examples/robot.yaml, written answer first.
#
# The answer comes first and the sentences are written for it, so every line is labelled
# by construction. Markup, [the words](slot_name), teaches a new way of saying a value:
# it reaches the gazetteer, decoding and the exported blob, and the generator then uses
# it everywhere.
#
#   edgenlu train examples/robot.yaml --extra examples/robot.extra.yaml \
#       --dev examples/robot.dev.yaml -o out/model
#
# stop, grab and release carry no slots at all, so the only thing that can help them is
# more ways of saying the same thing. That is most of this file.

# ---------------------------------------------------------------------------
# move: new ways of naming a heading
# ---------------------------------------------------------------------------

