  - name: set_light
    examples:
      - "flick the [bedroom](room) lamp [on](state)"
      - "[kitchen](room) bulb [off](state) kar dena"
      - "[bathroom](room) me lihgt [jalao](state)"
      - "kindly [off](state) [hall](room) lamp"
      - "i want the [living room](room) bulb [on](state) now"
      - "[rasoi](room) ki roshni [band](state) karna hai"
      - "[washroom](room) wali light [bujha do](state) zara"
      - "[sone ka kamra](room) [chalu](state) karo lamp"
      - "kya aap [baithak](room) ki light [jala do](state) ge"
      - "[bed room](room) lamp [off kar do](state) please"
      - "switch teh [kitchen](room) lamp [on](state)"
      - "[drawing room](room) bulb [on kar do](state) na"
      - "make the [bathroom](room) bulb go [off](state)"
      - "[gusalkhana](room) ki light [band kar do](state) bhai"
      - "hey [kamre](room) lamp [on](state)"
