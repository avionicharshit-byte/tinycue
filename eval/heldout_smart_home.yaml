# Held-out phrasings for examples/smart_home.yaml. Never train on this file.
#
# Every sentence here uses wording that is NOT in the commands file: different verbs,
# different word order, typos, missing words and speech-to-text run-ons. The slot words
# themselves come from the value lists, because a value nobody ever listed is a different
# problem. This is the honest test of whether the model generalises.

