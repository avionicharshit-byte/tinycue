<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From example sentences to an offline command</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · edge-nlu</p>
    <h1>From example sentences to an offline command</h1>

    <svg viewBox="0 0 968 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="edge-nlu-flow-title edge-nlu-flow-desc">
      <title id="edge-nlu-flow-title">How edge-nlu turns example sentences into offline commands</title>
      <desc id="edge-nlu-flow-desc">Flowchart in two groups. On a laptop, a commands file is expanded into more examples, an intent model and a CRF are trained, the confidence is calibrated and a cut-off chosen, and the result is exported as C code and a model file under 1 MB. That model file goes to the device, where typed or transcribed text runs through the intent model and CRF, and a confidence check either runs the action or asks the user whether they meant something else.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ GROUP CONTAINERS (painted first) ============ -->
      <rect x="32" y="76" width="376" height="496" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="440" y="76" width="496" height="496" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1" stroke-dasharray="4,4"/>

      <text x="32" y="66" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ON YOUR LAPTOP · BUILD TIME</text>
      <text x="440" y="66" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ON THE DEVICE · RUN TIME</text>

      <!-- ============ ARROWS (before boxes) ============ -->
      <!-- build lane, straight verticals -->
      <line x1="220" y1="156" x2="220" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="220" y1="252" x2="220" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="220" y1="348" x2="220" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="220" y1="444" x2="220" y2="484" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- run lane, straight verticals -->
      <line x1="688" y1="156" x2="688" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="688" y1="252" x2="688" y2="270" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- handoff: model file leaves the laptop and lands on the device -->
      <path d="M 340 514 H 416 A 8 8 0 0 0 424 506 V 234 A 8 8 0 0 1 432 226 H 564"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- branch: sure -->
      <path d="M 576 322 H 560 A 8 8 0 0 0 552 330 V 464"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- branch: unsure (accent) -->
      <path d="M 800 322 H 816 A 8 8 0 0 1 824 330 V 464"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ============ ARROW LABELS (masked, 8-10px clear of the stroke) ============ -->
      <rect x="466" y="206" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="498" y="215" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MODEL FILE</text>

      <rect x="506" y="392" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="524" y="401" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SURE</text>

      <rect x="834" y="392" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="858" y="401" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNSURE</text>

      <!-- ============ NODES ============ -->

      <!-- n1 start: commands file -->
      <rect x="100" y="104" width="240" height="52" rx="26" fill="#f5f5f5"/>
      <rect x="100" y="104" width="240" height="52" rx="26" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="220" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Commands file</text>
      <text x="220" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">commands.yaml</text>

      <!-- n2 -->
      <rect x="100" y="200" width="240" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="200" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Example generator</text>
      <text x="220" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">swaps in every synonym</text>

      <!-- n3 -->
      <rect x="100" y="296" width="240" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="296" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Train intent model + CRF</text>
      <text x="220" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">seconds on a laptop</text>

      <!-- n4 -->
      <rect x="100" y="392" width="240" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="392" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="414" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Calibrate confidence</text>
      <text x="220" y="430" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pick the unsure cut-off</text>

      <!-- n5 -->
      <rect x="100" y="488" width="240" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="488" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="510" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Export C code + model</text>
      <text x="220" y="526" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">under 1 MB</text>

      <!-- n6 start: text in -->
      <rect x="568" y="104" width="240" height="52" rx="26" fill="#f5f5f5"/>
      <rect x="568" y="104" width="240" height="52" rx="26" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="688" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Text in</text>
      <text x="688" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">typed, or from speech</text>

      <!-- n7 -->
      <rect x="568" y="200" width="240" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="200" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="688" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Intent model + CRF</text>
      <text x="688" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">command + slot values</text>

      <!-- n8 decision (focal) -->
      <polygon points="688,274 800,322 688,370 576,322" fill="#f5f5f5"/>
      <polygon points="688,274 800,322 688,370 576,322" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="688" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Confidence check</text>
      <text x="688" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">above the cut-off?</text>

      <!-- n9 -->
      <rect x="464" y="468" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="468" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="552" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run the action</text>
      <text x="552" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">light on</text>

      <!-- n10 -->
      <rect x="736" y="468" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="736" y="468" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="824" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ask, or go to cloud</text>
      <text x="824" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">did you mean ...?</text>

      <!-- ============ LEGEND ============ -->
      <line x1="32" y1="600" x2="936" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="622" width="20" height="12" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/>
      <text x="148" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">START</text>

      <rect x="248" y="622" width="20" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="276" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STEP</text>

      <polygon points="386,622 398,628 386,634 374,628" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="406" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DECISION</text>

      <line x1="520" y1="628" x2="544" y2="628" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="552" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">UNSURE PATH</text>

      <line x1="680" y1="628" x2="704" y2="628" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="712" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">GOES TO THE DEVICE</text>
    </svg>
  </div>
</body>
</html>
