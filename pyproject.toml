[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edge-nlu"
version = "0.0.1"
description = "Offline command understanding for tiny devices, under 1 MB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Harshit Dev" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
edgenlu = "edgenlu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edgenlu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
