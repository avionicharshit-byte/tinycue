[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edge-nlu"
version = "0.1.0"
description = "Offline command understanding for tiny devices, under 1 MB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Harshit Dev" }]
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "python-crfsuite>=0.9.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
edgenlu = "edgenlu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edgenlu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
