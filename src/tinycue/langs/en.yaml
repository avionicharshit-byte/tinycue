# English language resources for the generator.
#
# fillers:       words people drop into a sentence without changing its meaning
# droppable:     carrier words that can be removed without changing the meaning
# none_examples: out-of-scope sentences, used to teach the "no command" class
#
# Nothing here is tied to a domain. Domain wording belongs in the commands file.

fillers:
  - please
  - hey
  - can you
  - could you
  - just
  - now

droppable:
  - the
  - a
  - an
  - please
  - just

